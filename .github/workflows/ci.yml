name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      # ELECTRON_SKIP_BINARY_DOWNLOAD: no CI só typecheck/testamos; o binário não é necessário
      - run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 pnpm typecheck
      - run: pnpm test
      - run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 pnpm build
